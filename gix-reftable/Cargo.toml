lints.workspace = true

[package]
name = "gix-reftable"
version = "0.1.0"
description = "Git's reftable reference storage format"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false
test = true

[features]
## Enable support for SHA-1 object IDs.
sha1 = ["gix-hash/sha1"]
## Enable support for SHA-256 object IDs.
sha256 = ["gix-hash/sha256"]

[dependencies]
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
crc32fast = "1.5.0"
gix-error = { version = "^0.5.2", path = "../gix-error" }
gix-hash = { version = "^0.28.1", path = "../gix-hash" }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }

[package.metadata.docs.rs]
features = ["sha1", "sha256"]

[package.metadata.qa]
tests = [
    { args = ["--all-features"], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = ["--all-features"], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
]
